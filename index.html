<html lang="uk">
<head>
<meta charset="utf-8">
<title>Crespy Bank</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14263f">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Serif:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#14263f;--mute:#6b7686;--line:#e0dcd2;--gold:#b9821a;--goldbg:#fbf3df;--ok:#1f8a5b;--bad:#c9443b;--head:#14263f;--headink:#f3f1ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1522;--card:#13233a;--ink:#e9edf3;--mute:#93a1b4;--line:#243652;--gold:#e0a93a;--goldbg:#2a2412;--ok:#3ecb8b;--bad:#ff6b62;--head:#0a111c;--headink:#e9edf3}}
:root[data-theme="dark"]{--bg:#0c1522;--card:#13233a;--ink:#e9edf3;--mute:#93a1b4;--line:#243652;--gold:#e0a93a;--goldbg:#2a2412;--ok:#3ecb8b;--bad:#ff6b62;--head:#0a111c;--headink:#e9edf3}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
header{background:var(--head);color:var(--headink)}
.top{max-width:980px;margin:0 auto;padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font:700 20px "IBM Plex Serif",Georgia,serif;letter-spacing:.3px}.brand span{color:var(--gold)}
.bal{font:700 20px "IBM Plex Serif",Georgia,serif;color:var(--gold)}
nav{max-width:980px;margin:0 auto;display:flex;overflow-x:auto;padding:0 8px}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--headink);opacity:.65;padding:10px 14px;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
nav button.on{opacity:1;border-color:var(--gold)}
main{max-width:980px;margin:0 auto;padding:16px 16px 80px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px}h3{font-size:13px;margin:14px 0 6px;color:var(--mute);font-weight:500}
.sub{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
input,select{width:100%;padding:10px;margin:3px 0 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
button{font:inherit}
.b{padding:10px 14px;border:0;border-radius:8px;background:var(--gold);color:#fff;font-weight:700;cursor:pointer}
.b.alt{background:none;border:1px solid var(--line);color:var(--ink)}
.b:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.quest{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}.quest:last-child{border:0}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.tag{display:inline-block;background:var(--goldbg);color:var(--gold);border-radius:20px;padding:1px 10px;font-weight:700;font-size:13px}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad)}
.lk{color:var(--gold);font-weight:700}
/* --- картка --- */
.cardwrap{display:flex;justify-content:center;margin:6px 0 18px}
.ccard{position:relative;width:100%;max-width:400px;aspect-ratio:1.586;border-radius:24px;padding:22px 24px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:0 16px 34px #0007,inset 0 0 0 1px #ffffff14;transition:filter .3s}
.ccard::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% -10%,#ffffff22,transparent 55%);pointer-events:none}
.s-black{background:linear-gradient(150deg,#262626,#050505)}.s-graphite{background:linear-gradient(150deg,#4a5059,#16191e)}
.s-navy{background:linear-gradient(150deg,#244a86,#0b1b38)}.s-emerald{background:linear-gradient(150deg,#1f8a67,#06251b)}
.s-gold{background:linear-gradient(150deg,#d6a43a,#5a3d05)}.s-violet{background:linear-gradient(150deg,#6a45c9,#1c0f45)}
.ccard.frozen{filter:grayscale(1) brightness(.75)}
.ccard .t{display:flex;justify-content:space-between;align-items:center;font:700 16px "IBM Plex Serif",Georgia,serif;letter-spacing:.3px}
.ccard .t small{font:500 11px "IBM Plex Sans",sans-serif;letter-spacing:2px;opacity:.7}
.ccard .num{font:500 clamp(18px,6vw,26px) "IBM Plex Mono",ui-monospace,monospace;letter-spacing:2px;cursor:pointer;user-select:all}
.ccard .bt{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.ccard .hold{font-size:13px;letter-spacing:1.5px;opacity:.9;text-transform:uppercase}
.ccard .cb{font:700 18px "IBM Plex Serif",Georgia,serif}
.ccard .fz{position:absolute;right:18px;top:48px;border:1px solid #fff9;border-radius:6px;padding:2px 8px;font-size:11px;letter-spacing:2px;display:none}
.ccard.frozen .fz{display:block}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:520px;margin:0 auto 18px}
.act{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;color:var(--ink)}
.act i{display:block;font-style:normal;font-size:22px;line-height:1.2}.act span{font-size:12px;color:var(--mute)}
.act:hover{border-color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);border-radius:20px;padding:4px 12px;background:none;color:var(--ink);cursor:pointer;font-size:13px}.chip.on{background:var(--gold);border-color:var(--gold);color:#fff}
.tx{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}
.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--bg);flex:none;font-size:16px}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw button{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);cursor:pointer}.sw button.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.sw.cs button{width:64px;height:40px;border-radius:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{background:none;border:0;padding:8px 14px;color:var(--ink);cursor:pointer}.seg button.on{background:var(--gold);color:#fff}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.set:last-child{border:0}
.ov{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.ov.on{display:flex}
.ov .card{width:100%;max-width:380px;margin:0;text-align:center}.ov .card.l{text-align:left}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;z-index:40}
#msg.show{opacity:1}
</style>
</head>
<body>
<div id="auth" class="ov"><div class="card l">
  <div class="brand" style="color:var(--ink);margin-bottom:12px">Crespy <span>Bank</span></div>
  <div id="authForm">
    <input id="aE" type="email" autocomplete="email" data-ip="email">
    <input id="aP" type="password" autocomplete="current-password" data-ip="password">
    <div class="row"><button class="b" id="aIn" data-i="signIn" style="flex:1"></button><button class="b alt" id="aUp" data-i="signUp"></button></div>
  </div>
  <div id="mfaForm" style="display:none"><p data-i="mfaT"></p><input id="mC" inputmode="numeric" maxlength="6" data-ip="code"><div class="row"><button class="b" id="mOk" data-i="confirm" style="flex:1"></button><button class="b alt" id="mOut" data-i="signOut"></button></div></div>
  <div class="sub" id="aM" style="margin-top:10px"></div>
</div></div>
<div id="gate" class="ov"><div class="card"><div id="gI" style="font-size:44px"></div><h2 id="gT"></h2><p id="gM" class="sub" style="white-space:pre-line"></p><button class="b alt" id="gOut" data-i="signOut"></button></div></div>

<header>
  <div class="top"><div class="brand">Crespy <span>Bank</span></div><div class="bal" id="hBal"></div></div>

</header>
<main>
<section id="s-wallet" class="on">

</section>
<section id="s-settings">

    <div class="set"><span data-i="sTheme"></span><div class="seg" id="sTh"><button data-th="auto" data-i="thAuto"></button><button data-th="light" data-i="thLight"></button><button data-th="dark" data-i="thDark"></button></div></div>

  <div class="card"><h2 data-i="aGames"></h2><div id="aGL"></div><h3 data-i="aEdit"></h3>

</section>

let LANG=(navigator.language||'uk').startsWith('en')?'en':'uk';
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
if(ls('cb_lang')==='uk'||ls('cb_lang')==='en')LANG=ls('cb_lang');
const t=k=>D[LANG][k]||k;
let USER=null,P=null,BK=null,W=null,QL=[],AQ=[],AG=[],GATE=null,tab='wallet',FILTER='all',TR=null;
let TH=ls('cb_theme')||'auto',BGI=+(ls('cb_bg')||0),HIDE=ls('cb_hide')==='1';
const pre=new URLSearchParams(location.search).get('game')||'invest';
let tm;function toast(x){const m=$('msg');m.textContent=x;m.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>m.classList.remove('show'),3200)}
const MAP=[['already claimed','eClaimed'],['not enough bank','eLow'],['daily cap','eCap'],['quest not done','eQuest'],['account too new','eNew'],['too fast','eFast'],['mfa required','eMfa'],['not admin','eNoAdm'],['player not found','eNoPl'],['bad card','eCard'],['card frozen','eFrozen'],['card not found','eNoCard'],['player unavailable','eUnav'],['self','eSelf'],['bad amount','eBad'],['bad name','eBad']];
function em(m){m=m||'';if(m.includes('banned')||m.includes('maintenance')){loadProfile();return m}for(const[k,v]of MAP)if(m.includes(k))return t(v);return m}
/* act() with a short pause between actions: protects an honest player from accidental click spam */
let pend=0,last=0,chain=Promise.resolve();
function act(n,a){if(pend>=3)return Promise.resolve({error:{message:'too fast'}});pend++;
  const p=chain.then(async()=>{const w=700-(Date.now()-last);if(w>0)await sleep(w);last=Date.now();
    const r=await sb.rpc('act',{action:n,args:a});if(r.error)return r;if(r.data&&r.data.error)return{error:{message:r.data.error}};return{data:r.data&&r.data.data}}).finally(()=>{pend--});
  chain=p.catch(()=>{});return p}
/* ---------- theme and background ---------- */
const BG={light:['','#e8f0fb','#e7f4ee','#f9ebee','#efeaf9','#fdf3e3'],dark:['','#16181d','#0d1a14','#1d1017','#14122b','#1a1a1a']};
const BGDEF={light:'#f3f1ec',dark:'#0c1522'};
const CS=['black','graphite','navy','emerald','gold','violet'];
const resolved=()=>document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
function applyTheme(){const r=document.documentElement;TH==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=TH;const c=(BG[resolved()]||[])[BGI];c?r.style.setProperty('--bg',c):r.style.removeProperty('--bg')}
function renderSettings(){
  document.querySelectorAll('#sTh button').forEach(b=>b.classList.toggle('on',b.dataset.th===TH));
  const mode=resolved();$('sBg').innerHTML=BG[mode].map((c,i)=>`<button data-bg="${i}" class="${i===BGI?'on':''}" style="background:${c||BGDEF[mode]}" aria-label="bg ${i}"></button>`).join('');
  const cur=W&&W.card?W.card.style:'black';
  $('sCs').innerHTML=CS.map(s=>`<button data-cs="${s}" class="s-${s} ${s===cur?'on':''}" title="${esc(t('cs_'+s))}"></button>`).join('');
  $('sHide').checked=HIDE;$('sLang').value=LANG;
  const fz=W&&W.card&&W.card.frozen;$('sFz').textContent=t(fz?'qaUnfreeze':'qaFreeze');$('qaFzL').textContent=t(fz?'qaUnfreeze':'qaFreeze');
  if(W){const l=W.limits;$('sLimTxt').textContent=`${t('trLim')}: ${(+l.used_today).toFixed(2)} / ${l.daily} CG`;$('trLim').textContent=$('sLimTxt').textContent}
  if(P){const body=encodeURIComponent(`\n\n---\nID: ${P.pid}`);$('supGm').href='https://mail.google.com/mail/?view=cm&fs=1&to=support%40crespygames.pp.ua&su='+encodeURIComponent('Crespy Bank')+'&body='+body}}
function lang(){document.documentElement.lang=LANG;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll('[data-ip]').forEach(e=>e.placeholder=t(e.dataset.ip));render()}
function show(n){tab=n;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===n));document.querySelectorAll('section').forEach(x=>x.classList.toggle('on',x.id==='s-'+n));if(n==='admin')loadAdmin()}
$('nav').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.t)};
$('sLang').onchange=e=>{LANG=e.target.value;ls('cb_lang',LANG);lang()};
$('sTh').onclick=e=>{const b=e.target.closest('[data-th]');if(!b)return;TH=b.dataset.th;ls('cb_theme',TH);applyTheme();renderSettings()};
$('sBg').onclick=e=>{const b=e.target.closest('[data-bg]');if(!b)return;BGI=+b.dataset.bg;ls('cb_bg',BGI);applyTheme();renderSettings()};
$('sHide').onchange=e=>{HIDE=e.target.checked;ls('cb_hide',HIDE?'1':'0');renderWallet()};
$('sCs').onclick=async e=>{const b=e.target.closest('[data-cs]');if(!b)return;const r=await act('card_style',{style:b.dataset.cs});if(r.error)return toast(em(r.error.message));loadAll()};
const toggleFreeze=async()=>{if(!W)return;const r=await act('card_freeze',{frozen:!W.card.frozen});if(r.error)return toast(em(r.error.message));loadAll()};
$('sFz').onclick=toggleFreeze;$('qaFz').onclick=toggleFreeze;
/* ---------- auth ---------- */
async function auth(up){const email=$('aE').value.trim(),password=$('aP').value;$('aM').textContent='';
  const r=up?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(r.error)$('aM').textContent=r.error.message;else if(up&&!r.data.session)$('aM').textContent=t('checkMail')}
$('aIn').onclick=()=>auth(false);$('aUp').onclick=()=>auth(true);
$('mOk').onclick=async()=>{$('aM').textContent='';const f=await sb.auth.mfa.listFactors(),x=f.data&&f.data.totp&&f.data.totp[0];if(!x)return;
  const ch=await sb.auth.mfa.challenge({factorId:x.id});if(ch.error){$('aM').textContent=ch.error.message;return}
  const v=await sb.auth.mfa.verify({factorId:x.id,challengeId:ch.data.id,code:$('mC').value.trim()});if(v.error){$('aM').textContent=v.error.message;return}$('mC').value='';boot()};
const out=async()=>{await sb.auth.signOut();location.reload()};
$('mOut').onclick=out;$('sOut').onclick=out;$('gOut').onclick=out;
async function boot(){const{data}=await sb.auth.getSession();USER=data.session&&data.session.user||null;
  $('auth').classList.toggle('on',!USER);$('authForm').style.display='';$('mfaForm').style.display='none';
  if(!USER)return;
  const l=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(l.data&&l.data.nextLevel==='aal2'&&l.data.currentLevel!=='aal2'){$('authForm').style.display='none';$('mfaForm').style.display='';$('auth').classList.add('on');return}
  await loadProfile();if(!GATE)loadAll()}
sb.auth.onAuthStateChange((e)=>{if(e==='SIGNED_IN'||e==='SIGNED_OUT')boot()});
/* ---------- gate: ban, maintenance ---------- */
function gate(icon,title,msg){GATE=title;$('gI').textContent=icon;$('gT').textContent=title;$('gM').textContent=msg;$('gate').classList.add('on')}
async function loadProfile(){const[p,s]=await Promise.all([sb.from('profiles').select('*').maybeSingle(),sb.from('app_settings').select('*')]);
  if(p.error&&/fetch/i.test(p.error.message))return gate('📡',t('offT'),'');
  P=p.data;if(!P)return;
  $('navAdm').style.display=P.is_admin?'':'none';
  if(P.frozen){const perm=!P.ban_until||P.ban_until==='infinity',end=perm?null:new Date(P.ban_until);
    if(perm||end>new Date()){const d=perm?t('perm'):Math.max(1,Math.ceil((end-new Date())/864e5));return gate('🚫',t('banT'),`${t('banDays')}: ${d}\n${t('banReason')}: ${P.ban_reason||'—'}`)}}
  const m=((s.data||[]).find(x=>x.key==='maintenance')||{}).value||{};
  if(m.on&&!P.is_admin)return gate('🛠',t('maintT'),(m.msg?m.msg+'\n':'')+t('maintD'));
  if(GATE){location.reload()}}
/* ---------- data ---------- */
async function loadAll(){const[w,o,q]=await Promise.all([sb.rpc('bank_wallet'),sb.rpc('bank_overview'),sb.rpc('quests_list')]);
  if(w.error)return toast(em(w.error.message));
  W=w.data;BK=o.data;QL=q.data||[];render()}
const KI={transfer_in:'↓',transfer_out:'↑',quest:'★',topup:'⇢',admin:'⚙'};
function renderWallet(){if(!W)return;const c=W.card,el=$('bankCard');
  el.className='ccard s-'+c.style+(c.frozen?' frozen':'');
  $('cNum').textContent=fmtCard(c.number);$('cHold').textContent=c.holder||'';$('cBal').textContent=HIDE?'•••• CG':cg(W.balance);
  const rows=(W.ledger||[]).filter(l=>FILTER==='all'||(FILTER==='in'?+l.delta>0:+l.delta<0));
  $('hist').innerHTML=rows.length?rows.map(l=>`<div class="tx"><div class="row" style="flex-wrap:nowrap"><div class="ic">${KI[l.kind]||'•'}</div><div><b>${esc(t('k_'+l.kind)===('k_'+l.kind)?l.kind:t('k_'+l.kind))}</b> <span class="sub">${esc(l.ref||'')}</span><div class="sub">${new Date(l.at).toLocaleString(LANG)}${l.note?' · '+esc(l.note):''}</div></div></div><b class="${+l.delta>0?'ok':'bad'}">${+l.delta>0?'+':''}${(+l.delta).toFixed(2)}</b></div>`).join(''):`<div class="sub">${t('noHist')}</div>`}
function render(){
  $('hBal').textContent=W?cg(W.balance):'';$('tBal').textContent=W?cg(W.balance):'—';
  renderWallet();renderSettings();
  const games=(BK&&BK.games)||[];
  $('games').innerHTML=games.map(g=>`<div class="card" data-g="${esc(g.game)}" style="margin:0${g.game===pre?';border-color:var(--gold)':''}">
    <h2>${esc(g.title)}</h2><div class="sub">${t('rate')}: 1 CG = <b>${fm(g.rate)}</b></div><div class="sub">${t('cap')}: ${(+g.used_today).toFixed(2)} / ${(+g.daily_cap).toFixed(2)} CG</div>
    <input type="number" min="0" step="any" inputmode="decimal" id="in-${esc(g.game)}" placeholder="${t('amtCg')}">
    <div class="sub" id="pv-${esc(g.game)}" style="min-height:20px"></div>
    <div class="row"><button class="b" data-top="${esc(g.game)}">${t('topBtn')}</button>${g.url?`<a class="lk" href="${esc(g.url)}" target="_blank" rel="noopener">${t('openGame')} ↗</a>`:''}</div></div>`).join('');
  $('qList').innerHTML=QL.length?QL.map(q=>{const pr=Math.min(+q.progress,+q.goal),pct=+q.goal>0?Math.min(100,pr/+q.goal*100):100;
    return `<div class="quest"><div style="flex:1"><b>${esc(q.title)}</b> <span class="tag">+${(+q.reward).toFixed(2)} CG</span>${q.kind==='daily'?` <span class="sub">${t('daily')}</span>`:''}
    <div class="sub">${esc(q.descr||'')}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="sub">${t('prog')}: ${pr.toFixed(0)} / ${(+q.goal).toFixed(0)}</div></div>
    ${q.claimed?`<span class="ok">${t('claimed')}</span>`:`<button class="b" data-q="${esc(q.id)}"${q.done?'':' disabled'}>${t('claim')}</button>`}</div>`}).join(''):`<div class="sub">${t('noQ')}</div>`}
/* ---------- wallet actions ---------- */
$('hFilter').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;FILTER=b.dataset.f;document.querySelectorAll('#hFilter .chip').forEach(x=>x.classList.toggle('on',x===b));renderWallet()};
$('qaTop').onclick=()=>show('topup');
$('qaCopy').onclick=async()=>{if(!W)return;try{await navigator.clipboard.writeText(W.card.number);toast(t('copied'))}catch(e){toast(fmtCard(W.card.number))}};
$('cNum').onclick=$('qaCopy').onclick;
$('qaCsv').onclick=()=>{if(!W||!(W.ledger||[]).length)return toast(t('noHist'));const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
  const csv='time,type,ref,amount_cg,note\n'+W.ledger.map(l=>[l.at,l.kind,l.ref,l.delta,l.note].map(q).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='crespy_bank_statement.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)};
const trStep=n=>{$('trStep1').style.display=n===1?'':'none';$('trStep2').style.display=n===2?'':'none'};
$('qaTr').onclick=()=>{const b=$('trBox');const open=b.style.display==='none';b.style.display=open?'':'none';if(open){trStep(1);TR=null;b.scrollIntoView({behavior:'smooth'})}};
$('trCancel').onclick=()=>{$('trBox').style.display='none'};
$('trCard').oninput=e=>{e.target.value=fmtCard(e.target.value.replace(/\D/g,'').slice(0,12))};
$('trBack').onclick=()=>trStep(1);
$('trNext').onclick=async()=>{const card=$('trCard').value.replace(/\D/g,''),amt=parseFloat($('trAmt').value),note=$('trNote').value.trim();
  if(card.length!==12)return toast(t('eCard'));if(!(amt>=0.01&&isFinite(amt)))return toast(t('eAmt'));
  const r=await act('card_lookup',{card});if(r.error)return toast(em(r.error.message));
  TR={card,amt,note};$('trWho').textContent=r.data;$('trCardV').textContent='…'+card.slice(-4);$('trSum').textContent=cg(amt);$('trNoteV').textContent=note;trStep(2)};
$('trGo').onclick=async()=>{if(!TR)return;const r=await act('bank_transfer',TR);if(r.error)return toast(em(r.error.message));
  toast(t('trOk'));TR=null;$('trBox').style.display='none';$('trCard').value=$('trAmt').value=$('trNote').value='';loadAll()};
/* ---------- top up and quests ---------- */
$('games').oninput=e=>{const i=e.target.id;if(!i.startsWith('in-'))return;const g=(BK.games||[]).find(x=>'in-'+x.game===i),v=parseFloat(e.target.value)||0;$('pv-'+g.game).textContent=v>0?'= '+fm(v*g.rate):''};
$('games').onclick=async e=>{const b=e.target.closest('[data-top]');if(!b)return;const gid=b.dataset.top,v=parseFloat($('in-'+gid).value);
  if(!(v>0&&isFinite(v)))return toast(t('eAmt'));const r=await act('bank_topup',{gid,amt:v});
  if(r.error)return toast(em(r.error.message));toast(t('topOk'));loadAll()};
$('qList').onclick=async e=>{const b=e.target.closest('[data-q]');if(!b)return;const r=await act('quest_claim',{qid:b.dataset.q});
  if(r.error)return toast(em(r.error.message));toast(t('qOk'));loadAll()};
/* ---------- admin ---------- */
async function loadAdmin(){if(!P||!P.is_admin)return;const[q,g]=await Promise.all([sb.rpc('admin_quests'),sb.rpc('admin_bank_games')]);AQ=q.data||[];AG=g.data||[];
  $('aQL').innerHTML=AQ.map(x=>`<div class="quest"><div><b>${esc(x.title)}</b> <span class="sub">${esc(x.id)} · ${esc(x.metric)} ≥ ${x.goal} · ${esc(x.kind)} · ${x.active?'on':'off'}</span></div><div class="row"><span class="tag">+${(+x.reward).toFixed(2)}</span><button class="b alt" data-eq="${esc(x.id)}">✎</button></div></div>`).join('');
  $('aGL').innerHTML=AG.map(x=>`<div class="quest"><div><b>${esc(x.title)}</b> <span class="sub">${esc(x.game)} · 1 CG = ${x.rate} · ${x.daily_cap}/day · ${x.enabled?'on':'off'}</span></div><button class="b alt" data-eg="${esc(x.game)}">✎</button></div>`).join('')}
$('aQL').onclick=e=>{const b=e.target.closest('[data-eq]');if(!b)return;const x=AQ.find(y=>y.id===b.dataset.eq);
  $('qId').value=x.id;$('qTi').value=x.title;$('qDe').value=x.descr||'';$('qRe').value=x.reward;$('qKi').value=x.kind;$('qMe').value=x.metric;$('qGo').value=x.goal;$('qMi').value=x.min_age_hours;$('qAc').checked=x.active};
$('aGL').onclick=e=>{const b=e.target.closest('[data-eg]');if(!b)return;const x=AG.find(y=>y.game===b.dataset.eg);
  $('pgId').value=x.game;$('pgTi').value=x.title;$('pgUrl').value=x.url||'';$('pgRate').value=x.rate;$('pgCap').value=x.daily_cap;$('pgAc').checked=x.enabled};
async function adm(fn,p){const r=await sb.rpc(fn,p);if(r.error){toast(em(r.error.message));return false}toast(t('done'));return true}
$('gGo').onclick=async()=>{const a=parseFloat($('gA').value);if(!isFinite(a)||a===0)return toast(t('eAmt'));if(await adm('admin_bank_grant',{ppid:$('gP').value.trim(),amt:a,note:$('gN').value.trim()}))$('gA').value=''};
$('qSave').onclick=async()=>{if(await adm('admin_quest_upsert',{qid:$('qId').value.trim(),qgame:'invest',qtitle:$('qTi').value.trim(),qdescr:$('qDe').value.trim(),qreward:parseFloat($('qRe').value)||0,qkind:$('qKi').value,qmetric:$('qMe').value,qgoal:parseFloat($('qGo').value)||1,qmin:parseInt($('qMi').value)||0,qactive:$('qAc').checked}))loadAdmin()};
$('pgSave').onclick=async()=>{if(await adm('admin_bank_game_upsert',{gid:$('pgId').value.trim(),gtitle:$('pgTi').value.trim(),grate:parseFloat($('pgRate').value),gcap:parseFloat($('pgCap').value),genabled:$('pgAc').checked,gurl:$('pgUrl').value.trim()}))loadAdmin()};
applyTheme();lang();boot();
setInterval(()=>{if(USER&&!GATE&&tab!=='admin')loadAll()},30000);
})();
</script>
